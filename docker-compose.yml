version: '3.8'

services:
  web:
    build: 
      context: .
      target: runner
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  api:
    build:
      context: ./backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    environment:
      - DATABASE_URL=postgresql://marketai:secret@postgres:5432/marketai
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker-research:
    build:
      context: ./backend
    command: celery -A backend.celery_app worker -Q research.quick,research.deep -c 4
    environment:
      - DATABASE_URL=postgresql://marketai:secret@postgres:5432/marketai
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  worker-analysis:
    build:
      context: ./backend
    command: celery -A backend.celery_app worker -Q analysis -c 2
    environment:
      - DATABASE_URL=postgresql://marketai:secret@postgres:5432/marketai
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  worker-pdf:
    build:
      context: ./backend
    command: celery -A backend.celery_app worker -Q reports -c 2
    environment:
      - DATABASE_URL=postgresql://marketai:secret@postgres:5432/marketai
      - REDIS_URL=redis://redis:6379/0
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - S3_ENDPOINT=http://minio:9000
    depends_on:
      - postgres
      - redis
      - minio

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=marketai
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=marketai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin

volumes:
  pgdata:
