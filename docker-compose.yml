version: '3.8'

networks:
  public-net:
    driver: bridge
  internal-net:
    driver: bridge
    internal: true # Strict internal network isolation for DB, Redis, and MinIO

volumes:
  pgdata:
    driver: local
  miniodata:
    driver: local

services:
  web:
    build: 
      context: .
      target: runner
    networks:
      - public-net
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE=http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./backend
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --workers 4
    networks:
      - public-net
      - internal-net
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://marketai:secret_prod_pw@postgres:5432/marketai}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:-prod_symmetric_jwt_secret_key_32_bytes_min}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-marketai-enterprise}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - S3_ENDPOINT=http://minio:9000
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY:-minioadmin_secure_pw}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Worker Autoscaling: Research Queue (Scales 2 to 8 concurrency dynamically)
  worker-research:
    build:
      context: ./backend
    command: celery -A backend.app.workers.celery_app worker -Q research.quick,research.deep --autoscale=8,2 -l INFO -E
    networks:
      - internal-net
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://marketai:secret_prod_pw@postgres:5432/marketai}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Worker Autoscaling: Analysis Queue (Scales 1 to 4 concurrency)
  worker-analysis:
    build:
      context: ./backend
    command: celery -A backend.app.workers.celery_app worker -Q analysis --autoscale=4,1 -l INFO -E
    networks:
      - internal-net
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://marketai:secret_prod_pw@postgres:5432/marketai}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Worker Autoscaling: PDF Reports Queue (Scales 1 to 4 concurrency)
  worker-pdf:
    build:
      context: ./backend
    command: celery -A backend.app.workers.celery_app worker -Q reports --autoscale=4,1 -l INFO -E
    networks:
      - internal-net
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://marketai:secret_prod_pw@postgres:5432/marketai}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY:-minioadmin_secure_pw}
      - S3_ENDPOINT=http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD:-redis_secure_pass}
    networks:
      - internal-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_pass}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=marketai
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secret_prod_pw}
      - POSTGRES_DB=marketai
    networks:
      - internal-net
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketai -d marketai"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
      
  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    command: server /data --console-address ":9001"
    networks:
      - internal-net
    volumes:
      - miniodata:/data
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-minioadmin_secure_pw}
    restart: unless-stopped
