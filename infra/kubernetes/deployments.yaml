apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketai-api
  labels:
    app: marketai-api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: marketai-api
  template:
    metadata:
      labels:
        app: marketai-api
    spec:
      containers:
        - name: api
          image: marketai-backend:latest
          command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-research-quick
spec:
  replicas: 6
  selector:
    matchLabels:
      app: worker-research-quick
  template:
    metadata:
      labels:
        app: worker-research-quick
    spec:
      containers:
        - name: worker
          image: marketai-backend:latest
          command: ["celery", "-A", "backend.app.workers.celery_app.celery_app", "worker", "-Q", "research.quick", "-c", "4", "--loglevel=INFO"]
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
---
