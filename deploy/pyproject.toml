[project]
name = "market-research-agent"
version = "1.1.0"
description = "CrewAI AMP flow for the autonomous market research agent"
authors = [{ name = "Market Research Agent" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.12,<2.0.0",
    "openai>=1.0.0",
    "tavily-python>=0.7.0",
    "tenacity>=8.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
kickoff = "market_research_agent.main:kickoff"
run_with_trigger = "market_research_agent.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"