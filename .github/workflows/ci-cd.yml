name: MarketAI Production CI/CD Pipeline

on:
  push:
    branches:
      - main
      - staging
      - master
  pull_request:
    branches:
      - main
      - staging
      - master
  workflow_dispatch:

jobs:
  # =========================================================================
  # Stage 1: Static Analysis, Linting & Type Checking
  # =========================================================================
  lint-and-typecheck:
    name: 1. Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies (Lockfile Pinned)
        run: |
          npm ci --legacy-peer-deps

      - name: Frontend ESLint & TypeScript Verification
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies (Lockfile Pinned)
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r backend/requirements.lock

      - name: Backend Code Quality & Type Analysis
        env:
          PYTHONPATH: .
        run: |
          flake8 backend/ --max-line-length=120 --extend-ignore=E203,W503,E501,F401,F403 --exclude=backend/alembic/,alembic/
          mypy backend/app/ --ignore-missing-imports --no-strict-optional --allow-untyped-defs

  # =========================================================================
  # Stage 2: Unit & Integration Testing
  # =========================================================================
  unit-and-integration-tests:
    name: 2. Unit & Integration Tests
    needs: lint-and-typecheck
    if: success()
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: marketai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Test Dependencies (Lockfile Pinned)
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r backend/requirements.lock

      - name: Execute Backend Test Suite
        env:
          PYTHONPATH: .
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/marketai_test"
          REDIS_URL: "redis://localhost:6379/0"
          SECRET_KEY: ci-test-secret-key-environment
          FIREBASE_PROJECT_ID: gen-lang-client-0526957989
        run: |
          pytest tests/ --cov=backend/app --cov-report=xml

  # =========================================================================
  # Stage 3: Security Scanning (SAST) & Threat Defense Matrix
  # =========================================================================
  security-audit:
    name: 3. Security Test Suite & SAST
    needs: unit-and-integration-tests
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Security Suite & SAST Tooling (Lockfile Pinned)
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r backend/requirements.lock

      - name: Static Application Security Testing (Bandit SAST)
        run: |
          bandit -r backend/app -ll -ii --exclude backend/alembic

      - name: Execute Security & Threat Test Matrix
        env:
          PYTHONPATH: .
          DATABASE_URL: "sqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379/0"
          SECRET_KEY: test-security-key-for-ci-pipeline
          FIREBASE_PROJECT_ID: gen-lang-client-0526957989
        run: |
          pytest tests/security/ -v

  # =========================================================================
  # Stage 4: AI Benchmark Evaluation & Accuracy Release Gate
  # =========================================================================
  ai-benchmark-eval:
    name: 4. AI Benchmark & Accuracy Release Gate
    needs: security-audit
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies (Lockfile Pinned)
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r backend/requirements.lock

      - name: Execute AI Benchmark Evaluation & Quality Gate
        env:
          PYTHONPATH: .
        run: |
          python eval/run_eval.py

  # =========================================================================
  # Stage 5: Build Production Artifacts & Push Docker Container Images
  # =========================================================================
  build-and-package:
    name: 5. Build Artifacts & Push Docker Images
    needs: ai-benchmark-eval
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Build Next.js Production Assets (Lockfile Pinned)
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry (GHCR)
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Production Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}/marketai-backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/marketai-backend:latest

  # =========================================================================
  # Stage 6: Staging Deployment, Container Rollout & Live Smoke Tests
  # =========================================================================
  deploy-staging:
    name: 6. Staging Deployment & Live Smoke Tests
    needs: build-and-package
    if: success()
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Authenticate to Kubernetes Cluster
        env:
          KUBECONFIG_VAL: ${{ secrets.KUBECONFIG }}
        if: "${{ env.KUBECONFIG_VAL != '' }}"
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to Staging Cluster & Verify Rollout
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          
          # Set immutable image tag in Kustomize overlay
          cd deploy/k8s/overlays/staging
          kubectl kustomize . | sed "s|marketai-backend:latest|marketai-backend:${{ github.sha }}|g" > rendered-staging.yaml
          cd ../../../
          
          if [ -f ~/.kube/config ]; then
            kubectl apply -f deploy/k8s/overlays/staging/rendered-staging.yaml
            kubectl rollout status deployment/staging-marketai-api -n marketai-staging --timeout=180s
            kubectl rollout status deployment/staging-marketai-worker -n marketai-staging --timeout=180s
          else
            echo "No KUBECONFIG secret provided - dry-run validation succeeded."
            kubectl apply -f deploy/k8s/overlays/staging/rendered-staging.yaml --dry-run=client
          fi

      - name: Live Staging Service Health Smoke Test
        run: |
          echo "Executing live health check on deployed API service..."
          python -m pip install httpx
          if [ -f ~/.kube/config ]; then
            python scripts/smoke_test.py
          else
            echo "Skipping live smoke test (KUBECONFIG dry-run mode)."
          fi

      - name: Execute Disaster Recovery & SLO Validation Drill
        env:
          PYTHONPATH: .
        run: |
          python -m pip install --no-cache-dir -r backend/requirements.lock
          python scripts/disaster_recovery_drill.py

  # =========================================================================
  # Stage 7: Production Release & Canary Promotion
  # =========================================================================
  deploy-production:
    name: 7. Production Release & Zero-Downtime Rollout
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && success()
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Environment Secrets & Credentials (Fail Closed)
        env:
          KUBECONFIG_VAL: ${{ secrets.KUBECONFIG }}
        run: |
          echo "Validating environment secrets for production rollout..."
          if [ -z "$KUBECONFIG_VAL" ]; then
            echo "CRITICAL: Missing KUBECONFIG secret for production deployment. Failing closed." >&2
            exit 1
          fi

      - name: Authenticate to Production Kubernetes Cluster
        env:
          KUBECONFIG_VAL: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to Production Cluster & Verify Rollout Status
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          
          # Render with immutable GITHUB_SHA image tag
          cd deploy/k8s/overlays/production
          kubectl kustomize . | sed "s|marketai-backend:latest|marketai-backend:${{ github.sha }}|g" > rendered-prod.yaml
          cd ../../../
          
          if [ -f ~/.kube/config ]; then
            kubectl apply -f deploy/k8s/overlays/production/rendered-prod.yaml
            kubectl rollout status deployment/prod-marketai-api -n marketai-production --timeout=180s
            kubectl rollout status deployment/prod-marketai-worker -n marketai-production --timeout=180s
          else
            echo "CRITICAL: Missing KUBECONFIG secret for production deployment. Production deployment failed closed." >&2
            exit 1
          fi
